<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="產品三端旅程與觀察點" viewBox="0 0 1000 365"><title>產品三端旅程與觀察點</title><defs><marker id="arrow-journey" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#247E70"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" fill="#173B36"><rect x="20" y="30" width="280" height="88" rx="14" fill="#E8F2EF" stroke="#B9CEC7"/><text x="160.0" y="62" text-anchor="middle" font-size="20" font-weight="700">主辦控制端</text><text x="160.0" y="88" text-anchor="middle" font-size="14">帳號 → 活動 → QR → 控制</text><rect x="360" y="30" width="280" height="88" rx="14" fill="#E8F2EF" stroke="#B9CEC7"/><text x="500.0" y="62" text-anchor="middle" font-size="20" font-weight="700">來賓手機端</text><text x="500.0" y="88" text-anchor="middle" font-size="14">掃碼 → 自拍／留言 → 送出</text><rect x="700" y="30" width="280" height="88" rx="14" fill="#E8F2EF" stroke="#B9CEC7"/><text x="840.0" y="62" text-anchor="middle" font-size="20" font-weight="700">現場大螢幕</text><text x="840.0" y="88" text-anchor="middle" font-size="14">QR 歡迎頁／演出／彈幕</text><path d="M300,74 L360,74" stroke="#247E70" stroke-width="3" fill="none" marker-end="url(#arrow-journey)"/><path d="M640,74 L700,74" stroke="#247E70" stroke-width="3" fill="none" marker-end="url(#arrow-journey)"/><rect x="280" y="200" width="440" height="86" rx="14" fill="#FFF0D6" stroke="#B9CEC7"/><text x="500.0" y="232" text-anchor="middle" font-size="20" font-weight="700">活動識別與同步狀態</text><text x="500.0" y="258" text-anchor="middle" font-size="14">概念關係；後端實作尚未取得</text><path d="M160,118 L360,200" stroke="#247E70" stroke-width="3" fill="none" marker-end="url(#arrow-journey)"/><path d="M500,118 L500,200" stroke="#247E70" stroke-width="3" fill="none" marker-end="url(#arrow-journey)"/><path d="M720,244 L840,118" stroke="#247E70" stroke-width="3" fill="none" marker-end="url(#arrow-journey)"/><text x="30" y="335" font-size="17">觀察：同一活動？同一內容？只送一次？斷線後可恢復？切場不外洩？</text></g></svg>
