<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="分階段交付與核准關卡" viewBox="0 0 1000 220"><title>分階段交付與核准關卡</title><defs><marker id="arrow-timeline" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#247E70"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" fill="#173B36"><rect x="15" y="30" width="180" height="85" rx="14" fill="#E8F2EF" stroke="#B9CEC7"/><text x="105.0" y="62" text-anchor="middle" font-size="20" font-weight="700">G0 範圍確認</text><text x="105.0" y="88" text-anchor="middle" font-size="14">2–3 人時</text><rect x="215" y="30" width="180" height="85" rx="14" fill="#E8F2EF" stroke="#B9CEC7"/><text x="305.0" y="62" text-anchor="middle" font-size="20" font-weight="700">G1 資料就緒</text><text x="305.0" y="88" text-anchor="middle" font-size="14">4–5 人時</text><rect x="415" y="30" width="180" height="85" rx="14" fill="#E8F2EF" stroke="#B9CEC7"/><text x="505.0" y="62" text-anchor="middle" font-size="20" font-weight="700">G2 核心旅程</text><text x="505.0" y="88" text-anchor="middle" font-size="14">8–10 人時</text><rect x="615" y="30" width="180" height="85" rx="14" fill="#E8F2EF" stroke="#B9CEC7"/><text x="705.0" y="62" text-anchor="middle" font-size="20" font-weight="700">G3 邊界復原</text><text x="705.0" y="88" text-anchor="middle" font-size="14">8–12 人時</text><rect x="815" y="30" width="170" height="85" rx="14" fill="#E8F2EF" stroke="#B9CEC7"/><text x="900.0" y="62" text-anchor="middle" font-size="20" font-weight="700">G4 報告重測</text><text x="900.0" y="88" text-anchor="middle" font-size="14">6–9 人時</text><path d="M195,73 L215,73" stroke="#247E70" stroke-width="3" fill="none" marker-end="url(#arrow-timeline)"/><path d="M395,73 L415,73" stroke="#247E70" stroke-width="3" fill="none" marker-end="url(#arrow-timeline)"/><path d="M595,73 L615,73" stroke="#247E70" stroke-width="3" fill="none" marker-end="url(#arrow-timeline)"/><path d="M795,73 L815,73" stroke="#247E70" stroke-width="3" fill="none" marker-end="url(#arrow-timeline)"/><text x="25" y="159" font-size="18">就緒與授權確認後才執行；每階段回報已測、受阻、未測及剩餘額度。</text><text x="25" y="193" font-size="17">含復原準備估算 32–45 人時；等待客戶、修復及真實 7 天觀察另計。</text></g></svg>
