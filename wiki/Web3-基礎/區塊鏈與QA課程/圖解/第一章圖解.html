</style><style>body{margin:0;background:#f2f4ee;color:#18302e;font:17px/1.85 system-ui,"Microsoft JhengHei",sans-serif}main{max-width:840px;margin:auto;padding:24px;background:#fffefa}h1{font-size:30px}a{color:#146354}[tabindex]:focus-visible{outline:3px solid #b76d10;outline-offset:3px}</style></head><body><main><h1>第一章圖解</h1><p>四張圖分別呈現所有權交接、單筆簽署與驗證、訊息先後，以及點數程式的判斷。這些是教材模型，不表示已實作真實鏈。</p>
<figure class="course-diagram" id="diagram-ownership">
<h4>交易總覽：交出者的簽章，連到下一位的公鑰</h4><p>由左往右讀。每筆交易留下接收者的公鑰與交出者的簽章；私鑰由持有人保密。</p>
<div class="diagram-scroll" tabindex="0" role="region" aria-label="所有權交接圖，可橫向捲動"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="ownership-title ownership-desc"><title id="ownership-title">三次所有權交接的交易關係</title><desc id="ownership-desc">Owner 0 交給 Owner 1，Owner 1 交給 Owner 2，再由 Owner 2 交給 Owner 3；每次簽署前筆交易與接收者公鑰的摘要。</desc><defs><marker id="ownership-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#546865"/></marker></defs>
<path class="edge" d="M232 168 H276" marker-end="url(#ownership-arrow)"/><path class="edge" d="M484 168 H528" marker-end="url(#ownership-arrow)"/>
<rect class="box" x="24" y="56" width="208" height="224" rx="6"/><rect class="focus" x="276" y="56" width="208" height="224" rx="6"/><rect class="box" x="528" y="56" width="208" height="224" rx="6"/>
<text class="heading" x="40" y="92">前筆交易</text><text x="40" y="128">Owner 0 → Owner 1</text><line class="rule" x1="40" y1="148" x2="216" y2="148"/><text class="label" x="40" y="180">接收者公鑰</text><text x="40" y="208">Owner 1 公鑰</text><text class="label" x="40" y="240">簽章：Owner 0</text>
<text class="heading" x="292" y="92">本筆交易</text><text x="292" y="128">Owner 1 → Owner 2</text><line class="rule" x1="292" y1="148" x2="468" y2="148"/><text class="label" x="292" y="180">接收者公鑰</text><text x="292" y="208">Owner 2 公鑰</text><text class="label" x="292" y="240">簽章：Owner 1</text>
<text class="heading" x="544" y="92">下筆交易</text><text x="544" y="128">Owner 2 → Owner 3</text><line class="rule" x1="544" y1="148" x2="720" y2="148"/><text class="label" x="544" y="180">接收者公鑰</text><text x="544" y="208">Owner 3 公鑰</text><text class="label" x="544" y="240">簽章：Owner 2</text>
<text class="label" x="24" y="320">箭頭＝本筆接續前筆；詳見下一張的 Hash、Sign、Verify。</text><line class="rule" x1="24" y1="348" x2="736" y2="348"/><text class="label" x="24" y="380">綠框＝接下來放大解說的交易；這串交接不是區塊串接圖。</text></svg></div><p class="scroll-hint">窄螢幕可左右捲動圖框；圖下解說可直接閱讀。</p><figcaption>中間交易的 Owner 2 公鑰指定接收者；核對 Owner 1 簽章用的是前筆留下的 Owner 1 公鑰。概念依 Bitcoin 白皮書第二節重畫，沒有加入實際 UTXO 的多輸入／輸出結構。</figcaption>
</figure>
<figure class="course-diagram" id="diagram-signature">
<h4>單筆細解：Owner 1 怎麼交給 Owner 2？</h4><p>先讀上半部的簽署，再讀下半部的驗證。Sign 與 Verify 處理同一份被簽資料，但使用不同金鑰。</p>
<div class="diagram-scroll" tabindex="0" role="region" aria-label="簽署與驗證資料圖，可橫向捲動"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" role="img" aria-labelledby="signature-title signature-desc"><title id="signature-title">本筆交易的簽署與驗證資料</title><desc id="signature-desc">前筆交易與 Owner 2 公鑰一起取 Hash，由 Owner 1 私鑰簽署；驗證者用相同資料摘要、簽章及前筆 Owner 1 公鑰核對。</desc><defs><marker id="signature-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#546865"/></marker></defs>
<path class="edge" d="M304 128 H376" marker-end="url(#signature-arrow)"/><path class="edge" d="M304 252 H328 Q336 252 336 244 V192 Q336 184 344 184 H376" marker-end="url(#signature-arrow)"/><path class="edge" d="M448 216 V296" marker-end="url(#signature-arrow)"/>
<path class="edge active" d="M560 152 H544 Q536 152 536 160 V328 Q536 336 528 336 H520" marker-end="url(#signature-arrow)"/>
<path class="edge" d="M448 392 V472" marker-end="url(#signature-arrow)"/><path class="edge" d="M304 520 H376" marker-end="url(#signature-arrow)"/>
<rect class="mask" x="456" y="248" width="64" height="28"/><text class="tech" x="464" y="268">摘要</text><rect class="mask" x="548" y="252" width="80" height="28"/><text class="tech" x="556" y="272">Sign</text>
<rect class="box" x="24" y="80" width="280" height="104" rx="6"/><text class="heading" x="40" y="112">① 前筆交易</text><text class="label" x="40" y="144">已指定 Owner 1 為接收者</text><text class="label" x="40" y="168">包含公鑰、前次簽章等資料</text>
<rect class="box" x="24" y="220" width="280" height="64" rx="6"/><text x="40" y="260">Owner 2 公鑰（本次接收者）</text>
<rect class="focus" x="376" y="104" width="144" height="112" rx="6"/><text class="heading" x="392" y="140">② Hash</text><text class="label" x="392" y="172">把左側兩項</text><text class="label" x="392" y="196">綁成一個摘要</text>
<rect class="key" x="560" y="112" width="176" height="88" rx="6"/><text x="576" y="148">Owner 1 私鑰</text><text class="label" x="576" y="180">保密；不放入交易</text>
<rect class="focus" x="376" y="296" width="144" height="96" rx="6"/><text class="heading" x="392" y="328">③ 產生簽章</text><text class="label" x="392" y="356">Owner 1 簽章</text><text class="label" x="392" y="380">放入本筆交易</text>
<rect class="box" x="24" y="472" width="280" height="88" rx="6"/><text x="40" y="508">前筆留下的 Owner 1 公鑰</text><text class="label" x="40" y="540">驗證者可取得，不需要私鑰</text>
<rect class="box" x="376" y="472" width="360" height="88" rx="6"/><text class="heading" x="392" y="508">④ Verify：核對授權</text><text class="label" x="392" y="540">重新算相同資料的摘要，配合簽章與公鑰</text>
<line class="rule" x1="24" y1="600" x2="736" y2="600"/><text class="label" x="24" y="632">箭頭＝資料供給；綠框＝摘要與簽章；米色框＝保密金鑰。</text></svg></div><p class="scroll-hint">窄螢幕可左右捲動；依 ①→②→③→④ 閱讀。</p><figcaption>驗證必須對應相同的被簽資料。改掉接收者公鑰後，不能沿用原簽章當成新資料已獲授權。即使簽章有效，仍需排除雙花並決定共同歷史。</figcaption>
</figure>
<figure class="course-diagram" id="diagram-sequence">
<h4>三節點時序：發出相同要求，收到的先後仍可能不同</h4><p>由上往下是時間。這是一個可能的網路到達順序，沒有宣稱訊息會按發出順序到達每個節點。</p>
<div class="diagram-scroll" tabindex="0" role="region" aria-label="Alice 與三節點訊息時序圖，可橫向捲動"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" role="img" aria-labelledby="sequence-title sequence-desc"><title id="sequence-title">三個節點收到不同交易順序的時序</title><desc id="sequence-desc">A 先收到 T1 再收到 T2，B 先收到 T2 再收到 T1，C 暫時只收到 T1；各自驗證仍未形成共同歷史。</desc><defs><marker id="sequence-open" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#546865" stroke-width="1.5"/></marker></defs>
<line class="line" x1="100" y1="100" x2="100" y2="460"/><line class="line" x1="284" y1="100" x2="284" y2="460"/><line class="line" x1="468" y1="100" x2="468" y2="460"/><line class="line" x1="652" y1="100" x2="652" y2="460"/>
<path class="edge" stroke-dasharray="5 4" d="M100 172 H284" marker-end="url(#sequence-open)"/><path class="edge" stroke-dasharray="5 4" d="M100 240 H468" marker-end="url(#sequence-open)"/><path class="edge" stroke-dasharray="5 4" d="M100 308 H652" marker-end="url(#sequence-open)"/><path class="edge" stroke-dasharray="5 4" d="M100 376 H284" marker-end="url(#sequence-open)"/><path class="edge" stroke-dasharray="5 4" d="M100 444 H468" marker-end="url(#sequence-open)"/>
<rect class="mask" x="124" y="124" width="136" height="32"/><text x="140" y="148">T1：給 Bob 7</text><rect class="mask" x="300" y="192" width="152" height="32"/><text x="312" y="216">T2：給 Carol 6</text><rect class="mask" x="492" y="260" width="144" height="32"/><text x="504" y="284">T1：給 Bob 7</text><rect class="mask" x="124" y="328" width="152" height="32"/><text x="136" y="352">T2：給 Carol 6</text><rect class="mask" x="300" y="396" width="144" height="32"/><text x="312" y="420">T1：給 Bob 7</text>
<rect class="box" x="32" y="36" width="136" height="64" rx="6"/><text class="heading" x="64" y="76">Alice</text><rect class="box" x="216" y="36" width="136" height="64" rx="6"/><text class="heading" x="248" y="76">節點 A</text><rect class="box" x="400" y="36" width="136" height="64" rx="6"/><text class="heading" x="432" y="76">節點 B</text><rect class="box" x="584" y="36" width="136" height="64" rx="6"/><text class="heading" x="616" y="76">節點 C</text>
<text class="label" x="220" y="500">A：T1 成功</text><text class="label" x="220" y="528">T2 餘額不足</text><text class="label" x="404" y="500">B：T2 成功</text><text class="label" x="404" y="528">T1 餘額不足</text><text class="label" x="588" y="500">C：T1 成功</text><text class="label" x="588" y="528">暫未收到 T2</text>
<line class="rule" x1="24" y1="572" x2="736" y2="572"/><text class="label" x="24" y="604">虛線箭頭＝單向訊息；縱向虛線＝各參與者的時間線。</text><text class="label" x="24" y="636">三者仍需共同規則決定接受哪份歷史；本章程式尚未實作。</text></svg></div><p class="scroll-hint">窄螢幕可左右捲動，按每條箭頭的終點辨認接收者。</p><figcaption>三台電腦起點都是 Alice=10、Bob=0、Carol=0。此圖對照節點各自依最新餘額驗證的結果；收到訊息、驗證交易與網路確認是不同事件。</figcaption>
</figure>
<figure class="course-diagram" id="diagram-transfer">
<h4>轉帳流程：先檢查，全部通過才改餘額</h4><p>對照正常版本的 apply_transfer。每一個「否」分支都立即回傳，三人的餘額保持原樣。</p>
<div class="diagram-scroll" tabindex="0" role="region" aria-label="點數轉帳條件流程圖，可橫向捲動"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 960" role="img" aria-labelledby="transfer-title transfer-desc"><title id="transfer-title">正常點數轉帳函式的檢查與更新流程</title><desc id="transfer-desc">先檢查帳戶存在，再檢查金額為正整數，最後檢查餘額；任一失敗不改帳，全部通過才扣款與加款。</desc><defs><marker id="transfer-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#546865"/></marker></defs>
<path class="edge" d="M240 96 V132" marker-end="url(#transfer-arrow)"/><path class="edge" d="M240 276 V320" marker-end="url(#transfer-arrow)"/><path class="edge" d="M240 464 V508" marker-end="url(#transfer-arrow)"/><path class="edge active" d="M240 652 V720" marker-end="url(#transfer-arrow)"/><path class="edge active" d="M240 808 V848" marker-end="url(#transfer-arrow)"/>
<path class="edge" d="M392 204 H504" marker-end="url(#transfer-arrow)"/><path class="edge" d="M392 392 H504" marker-end="url(#transfer-arrow)"/><path class="edge" d="M392 580 H504" marker-end="url(#transfer-arrow)"/>

<rect class="mask" x="424" y="164" width="40" height="24"/><text class="label" x="432" y="182">否</text><rect class="mask" x="424" y="352" width="40" height="24"/><text class="label" x="432" y="370">否</text><rect class="mask" x="424" y="540" width="40" height="24"/><text class="label" x="432" y="558">否</text>
<rect class="box" x="112" y="32" width="256" height="64" rx="20"/><text class="heading" x="132" y="72">收到轉帳要求</text>
<path class="box" d="M240 132 L392 204 L240 276 L88 204 Z"/><text x="160" y="200">付款／收款帳戶</text><text x="180" y="228">都存在？</text><rect class="failure" x="504" y="164" width="232" height="80" rx="20"/><text class="tech" x="516" y="196">False: UNKNOWN_ACCOUNT</text><text class="label" x="520" y="224">停止；所有餘額不變</text>

<path class="box" d="M240 508 L392 580 L240 652 L88 580 Z"/><text x="144" y="576">付款人的目前餘額</text><text x="164" y="604">足以支付？</text><rect class="failure" x="504" y="540" width="232" height="80" rx="20"/><text class="tech" x="516" y="572">INSUFFICIENT_BALANCE</text><text class="label" x="520" y="600">回傳 False；所有餘額不變</text>
<rect class="focus" x="112" y="720" width="256" height="88" rx="6"/><text class="heading" x="132" y="752">扣付款人，再加收款人</text><text class="label" x="132" y="784">兩項檢查與餘額檢查皆已通過</text>
<rect class="focus" x="112" y="848" width="256" height="64" rx="20"/><text class="tech" x="144" y="888">True: APPLIED</text><text class="label" x="408" y="752">QA 切入：拒絕分支有沒有改帳？</text><text class="label" x="408" y="784">不能只看回覆，要比對前後快照。</text>
<line class="rule" x1="24" y1="928" x2="736" y2="928"/><text class="label" x="24" y="952">菱形＝條件；矩形＝更新；圓角端點＝開始／回傳；箭頭＝下一步。</text></svg></div><p class="scroll-hint">窄螢幕可左右捲動；先沿「是」走，再逐一追「否」的出口。</p><figcaption>此圖只對應本章的免手續費點數模型。它沒有簽章、Nonce、UTXO、網路與共識；不能把「拒絕不改帳」直接套成真實鏈失敗交易完全不收費。</figcaption>
</figure>
<p>來源與界線：交易圖依 Bitcoin 白皮書第二節（bitcoin.org/bitcoin.pdf）的所有權鏈重畫；時序與流程依本章明示案例及 Python 程式。沒有收錄原圖像素，也不宣稱本模型已連接真實鏈。可點擊的選讀來源保留在學習包的來源段。</p></main></body></html>
